  Auth + database are handled by Supabase. The URL and anon key
  below point to your project. Email/Password auth must be enabled
  in the Supabase Dashboard → Authentication → Providers → Email.

  A `user_data` table must exist with columns:
    id (UUID PK → auth.users), vehicles (JSONB), two_fa (JSONB), updated_at (TIMESTAMPTZ)
  with Row Level Security policies so each user can only access their own row.

  Without this setup, the app still works using local browser storage.
  ════════════════════════════════════════════════════════════════
-->
