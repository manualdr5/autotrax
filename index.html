// Fetch all available year/make/model/trim rows (for dropdowns)
async function sbFetchVehicleOptions() {
  const sb = getSB();
  if (!sb) return null;
  try {
    const { data, error } = await sb
      .from("vehicle_schedules")
      .select("year, make, model, trim")
      .order("make").order("model").order("year", { ascending: true });
    return error ? null : data;
  } catch { return null; }
}

// Fetch the maintenance array for a specific vehicle
async function sbFetchSchedule(year, make, model, trim) {
  const sb = getSB();
  if (!sb) return null;
  try {
    const { data, error } = await sb
      .from("vehicle_schedules")
      .select("maintenance")
      .eq("year", parseInt(year))
      .eq("make", make)
      .eq("model", model)
      .eq("trim", trim)
      .single();
    return (error || !data) ? null : { maintenance: data.maintenance };
  } catch { return null; }
}

// ─── LOCAL FALLBACK HELPERS ───────────────────────────────────────
// Convert LS430_DB to the same flat-row format Supabase returns
function localVehicleRows() {
  const rows = [];
  for (const make of Object.keys(LS430_DB)) {
    for (const model of Object.keys(LS430_DB[make])) {
      const entry = LS430_DB[make][model];
      for (const year of entry.years) {
        for (const trim of entry.trims) {
          rows.push({ year: parseInt(year), make, model, trim });
        }
      }
    }
  }
  return rows;
}
function localSchedule(year, make, model) {
  return LS430_DB[make]?.[model]?.schedules?.[parseInt(year)] || null;
}

// ─── DROPDOWN DERIVATION (works with both Supabase rows & local rows)
function getAvailYears(rows)  {
  return [...new Set(rows.map(r => String(r.year)))].sort((a,b) => a - b);
}
function getAvailMakes(rows, year) {
  if (!year) return [];
  return [...new Set(rows.filter(r => String(r.year) === year).map(r => r.make))].sort();
}
function getAvailModels(rows, year, make) {
  if (!make) return [];
  return [...new Set(rows.filter(r => String(r.year) === year && r.make === make).map(r => r.model))].sort();
}
function getAvailTrims(rows, year, make, model) {
  if (!model) return [];
  return [...new Set(rows.filter(r => String(r.year) === year && r.make === make && r.model === model).map(r => r.trim))].sort();
}

function autoCategory(name) {
  const n = name.toLowerCase();
  if (n.match(/oil|air cleaner|spark|engine|fuel filter|belt|timing|valve|piston|throttle/)) return "Engine";
  if (n.match(/brake|rotor|caliper|pad/)) return "Brakes";
  if (n.match(/tire|tyre|wheel|rotation/)) return "Tires";
  if (n.match(/transmission|transaxle|differential|transfer|cvt|clutch|axle|driveline|drive line|drive shaft/)) return "Drivetrain";
  if (n.match(/coolant|cooling|radiator|thermostat/)) return "Cooling";
  if (n.match(/battery|alternator|electrical/)) return "Electrical";
  if (n.match(/cabin|air filter|interior/)) return "Interior";
  if (n.match(/wiper|windshield|washer fluid/)) return "Visibility";
  if (n.match(/steering|suspension|shock|strut|bushing/)) return "Suspension";
  return "General";
}

function autoPriority(name) {
  const n = name.toLowerCase();
  if (n.match(/oil|timing belt|coolant|brake fluid|transmission fluid|transaxle|cvt fluid/)) return "critical";
  if (n.match(/spark plug|serpentine belt|battery|tire|differential|transfer case|fuel filter|brake pad|rotor/)) return "high";
  if (n.match(/air cleaner|cabin filter|wiper|washer|rotation/)) return "medium";
  return "low";
}

function parseApiData(data) {
  const maint = data.maintenance || [];
  const map = {};
  for (const entry of maint) {
    const miles = (typeof entry.mileage === "object") ? entry.mileage.miles : entry.mileage;
    for (const svc of entry.service_items) {
      if (!map[svc]) map[svc] = [];
      map[svc].push(miles);
    }
  }
  return Object.entries(map).map(([name, mileages]) => {
    mileages.sort((a, b) => a - b);
    const gaps = mileages.slice(1).map((m, i) => m - mileages[i]);
    const interval = gaps.length > 0 ? Math.min(...gaps) : (mileages[0] || 10000);
    return {
      id: name.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, ""),
      name, mileages, interval,
      category: autoCategory(name),
      priority: autoPriority(name),
      source: "api",
    };
  });
}

// ─── TOTP UTILITIES (RFC 6238 — runs 100% client-side) ───────────
const _B32 = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";

function _b32Encode(bytes) {
  let bits = 0, val = 0, out = "";
  for (const b of bytes) {
    val = (val << 8) | b; bits += 8;
    while (bits >= 5) { bits -= 5; out += _B32[(val >> bits) & 31]; }
  }
  if (bits > 0) out += _B32[(val << (5 - bits)) & 31];
  return out;
}
function _b32Decode(str) {
  str = str.toUpperCase().replace(/[^A-Z2-7]/g, "");
  const out = []; let bits = 0, val = 0;
  for (const c of str) {
    val = (val << 5) | _B32.indexOf(c); bits += 5;
    if (bits >= 8) { bits -= 8; out.push((val >> bits) & 0xFF); }
  }
  return new Uint8Array(out);
}
async function _totpCode(secret, offset = 0) {
  const T = Math.floor(Date.now() / 30000) + offset;
  const buf = new ArrayBuffer(8);
  const dv = new DataView(buf);
  dv.setUint32(0, Math.floor(T / 0x100000000) >>> 0, false);
  dv.setUint32(4, T >>> 0, false);
  const key = await crypto.subtle.importKey("raw", _b32Decode(secret), { name:"HMAC", hash:"SHA-1" }, false, ["sign"]);
  const sig = new Uint8Array(await crypto.subtle.sign("HMAC", key, buf));
  const o = sig[19] & 0xF;
  const code = ((sig[o]&0x7F)<<24|(sig[o+1]&0xFF)<<16|(sig[o+2]&0xFF)<<8|(sig[o+3]&0xFF)) % 1_000_000;
  return String(code).padStart(6, "0");
}
async function verifyTotp(secret, token) {
  const t = token.replace(/\D/g, "");
  if (t.length !== 6) return false;
  for (const offset of [-1, 0, 1]) { if (await _totpCode(secret, offset) === t) return true; }
  return false;
}
function newTotpSecret() {
  const bytes = new Uint8Array(20); crypto.getRandomValues(bytes); return _b32Encode(bytes);
}
function totpUri(secret, email) {
  return `otpauth://totp/AutoTrax:${encodeURIComponent(email)}?secret=${secret}&issuer=AutoTrax&algorithm=SHA1&digits=6&period=30`;
}
function fmtSecret(s) { return s.match(/.{1,4}/g)?.join(" ") || s; }

function getStatus(item, currentMileage, logs) {
  const relevant = logs.filter(l => l.serviceId === item.id).sort((a,b) => b.mileage - a.mileage);
  const lastLog  = relevant[0] || null;
  const lastMi   = lastLog ? lastLog.mileage : null;
  const baseMi   = lastMi != null ? lastMi : 0;
  let dueAt;
  if (item.mileages && item.mileages.length > 0) {
    const next = item.mileages.find(m => m > baseMi);
    dueAt = next || (baseMi + item.interval);
  } else {
    dueAt = baseMi + item.interval;
  }
  const remaining = dueAt - currentMileage;
  const span = dueAt - baseMi;
  const pct = lastMi != null && span > 0
    ? Math.min(100, Math.max(0, ((currentMileage - baseMi) / span) * 100))
    : (item.mileages ? Math.min(100, Math.max(0, (currentMileage / dueAt) * 100)) : null);
  let status;
  if (lastMi == null) {
    status = item.mileages && currentMileage >= (item.mileages[0] || 0) ? "soon" : "unknown";
  } else if (remaining < 0) {
    status = "overdue";
  } else if (remaining <= item.interval * 0.15) {
    status = "soon";
  } else {
    status = "good";
  }
  return { lastLog, lastMi, dueAt, remaining, pct, status };
}

  );
}

function QRCodeView({ value, size = 180 }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !window.QRCode) return;
    ref.current.innerHTML = "";
    new window.QRCode(ref.current, { text: value, width: size, height: size, correctLevel: window.QRCode.CorrectLevel.M });
  }, [value, size]);
  return <div ref={ref} className="flex items-center justify-center"/>;
}

function AuthScreen({ onAuth }) {
  const [mode, setMode]       = useState("login"); // "login" | "signup" | "reset"
  const [email, setEmail]     = useState("");
  const [password, setPass]   = useState("");
  const [confirm, setConfirm] = useState("");
  const [showPw, setShowPw]   = useState(false);
  const [loading, setLoading] = useState(false);
  const [err, setErr]         = useState("");
  const [info, setInfo]       = useState("");

  const inp = "w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white";

  function friendlyError(code) {
    if (!code) return "Something went wrong. Please try again.";
    if (code.includes("user-not-found") || code.includes("wrong-password") || code.includes("invalid-credential"))
      return "Incorrect email or password.";
    if (code.includes("email-already-in-use")) return "An account with this email already exists.";
    if (code.includes("weak-password")) return "Password must be at least 6 characters.";
    if (code.includes("invalid-email")) return "Please enter a valid email address.";
    if (code.includes("too-many-requests")) return "Too many attempts. Please wait a moment and try again.";
    if (code.includes("network-request-failed")) return "Network error. Check your internet connection.";
    return code.replace("auth/", "").replace(/-/g, " ");
  }

  async function handleSubmit(e) {
    e.preventDefault();
    setErr(""); setInfo(""); setLoading(true);
    try {
      if (mode === "reset") {
        await window.fbAuth.sendPasswordResetEmail(email);
        setInfo("Password reset email sent! Check your inbox.");
        setMode("login");
      } else if (mode === "signup") {
        if (password !== confirm) { setErr("Passwords do not match."); setLoading(false); return; }
        const cred = await window.fbAuth.createUserWithEmailAndPassword(email, password);
        onAuth(cred.user);
      } else {
        const cred = await window.fbAuth.signInWithEmailAndPassword(email, password);
        onAuth(cred.user);
      }
    } catch(e) {
      setErr(friendlyError(e.code || e.message));
    }
    setLoading(false);
  }

  const titles = { login:"Sign in to AutoTrax", signup:"Create your account", reset:"Reset password" };
  const btnLabels = { login:"Sign In", signup:"Create Account", reset:"Send Reset Email" };

  return (
    <div style={{height:"100vh"}} className="flex items-center justify-center bg-gradient-to-br from-gray-900 via-gray-800 to-blue-950 p-4">
      <div className="w-full max-w-sm">
        {/* Logo */}
        <div className="text-center mb-8">
          <div className="w-14 h-14 bg-blue-500 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-2xl">
            <CarIcon size={28} className="text-white"/>
          </div>
          <h1 className="text-2xl font-bold text-white">AutoTrax</h1>
          <p className="text-gray-400 text-sm mt-1">Car Maintenance Tracker</p>
        </div>

        {/* Card */}
        <div className="bg-white rounded-2xl shadow-2xl p-6">
          <h2 className="text-lg font-bold text-gray-800 mb-1">{titles[mode]}</h2>
          {mode === "login"  && <p className="text-sm text-gray-500 mb-5">Your vehicles and history sync across all devices.</p>}
          {mode === "signup" && <p className="text-sm text-gray-500 mb-5">Free account — your data is saved in the cloud.</p>}
          {mode === "reset"  && <p className="text-sm text-gray-500 mb-5">Enter your email and we'll send a reset link.</p>}

          {info && <div className="mb-4 text-sm text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-xl px-4 py-3">{info}</div>}

          <form onSubmit={handleSubmit} className="space-y-3">
            <div>
              <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Email</label>
              <input type="email" required autoComplete="email" placeholder="you@example.com"
                value={email} onChange={e=>setEmail(e.target.value)} className={inp}/>
            </div>

            {mode !== "reset" && (
              <div>
                <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Password</label>
                <div className="relative">
                  <input type={showPw?"text":"password"} required autoComplete={mode==="signup"?"new-password":"current-password"}
                    placeholder={mode==="signup"?"At least 6 characters":"Your password"}
                    value={password} onChange={e=>setPass(e.target.value)}
                    className={`${inp} pr-10`}/>
                  <button type="button" onClick={()=>setShowPw(p=>!p)}
                    className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                    {showPw ? <EyeOffIcon size={16}/> : <EyeIcon size={16}/>}
                  </button>
                </div>
              </div>
            )}

            {mode === "signup" && (
              <div>
                <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Confirm Password</label>
                <input type={showPw?"text":"password"} required autoComplete="new-password"
                  placeholder="Re-enter password"
                  value={confirm} onChange={e=>setConfirm(e.target.value)} className={inp}/>
              </div>
            )}

            {err && <div className="text-sm text-red-600 bg-red-50 border border-red-200 rounded-xl px-4 py-3">{err}</div>}

            <button type="submit" disabled={loading}
              className="w-full flex items-center justify-center gap-2 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm transition-colors disabled:opacity-60 shadow-lg shadow-blue-200 mt-1">
              {loading ? <><SpinnerIcon size={14}/> Please wait…</> : btnLabels[mode]}
            </button>
          </form>

          {/* Mode switcher */}
          <div className="mt-4 flex flex-col gap-2 text-center text-sm">
            {mode === "login" && <>
              <button onClick={()=>{setMode("signup");setErr("");setInfo("");}}
                className="text-blue-600 hover:text-blue-800 font-medium">
                Don't have an account? Sign up
              </button>
              <button onClick={()=>{setMode("reset");setErr("");setInfo("");}}
                className="text-gray-400 hover:text-gray-600 text-xs">
                Forgot password?
              </button>
            </>}
            {mode === "signup" && (
              <button onClick={()=>{setMode("login");setErr("");setInfo("");}}
                className="text-blue-600 hover:text-blue-800 font-medium">
                Already have an account? Sign in

            {mode === "reset" && (

        <p className="text-center text-gray-600 text-xs mt-4">

// ─── MILEAGE EDITOR ─────────────────────────────────────────────
function MileageEditor({value,onSave}) {
  const [editing,setEditing] = useState(false);
  const [input,setInput] = useState(String(value));
  useEffect(()=>{if(!editing)setInput(String(value));},[value,editing]);
  function save(){const v=parseInt(input,10);if(!isNaN(v)&&v>=0)onSave(v);setEditing(false);}
  if(!editing) return (
    <button onClick={()=>{setInput(String(value));setEditing(true);}} className="flex items-center gap-2 group mt-1">
      <span className="text-3xl font-bold text-gray-800">{value.toLocaleString()}</span>
      <span className="text-base text-gray-500 font-medium">miles</span>
      <EditIcon size={14} className="text-gray-400 opacity-0 group-hover:opacity-100 transition-opacity"/>
    </button>
  );
  return (
    <div className="flex items-center gap-2 mt-1">
      <input autoFocus type="number" min="0" value={input}
        onChange={e=>setInput(e.target.value)}
        onKeyDown={e=>{if(e.key==="Enter")save();if(e.key==="Escape")setEditing(false);}}
        className="text-2xl font-bold w-36 border-b-2 border-blue-500 bg-transparent focus:outline-none text-gray-800"/>
      <span className="text-base text-gray-500 font-medium">miles</span>
      <button onClick={save} className="p-1.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700"><SaveIcon size={14}/></button>
      <button onClick={()=>setEditing(false)} className="p-1.5 bg-gray-200 text-gray-600 rounded-lg hover:bg-gray-300"><XIcon size={14}/></button>
    </div>
  );
}

// ─── FETCH OEM SCHEDULE MODAL ────────────────────────────────────
function FetchScheduleModal({vehicle, onSuccess, onClose}) {
  const [rows,    setRows]    = useState(null);   // flat list from Supabase or local
  const [loading, setLoading] = useState(true);   // loading dropdown options
  const [submitting, setSub]  = useState(false);
  const [year,  setYear]  = useState("");
  const [make,  setMake]  = useState("");
  const [model, setModel] = useState("");
  const [trim,  setTrim]  = useState("");
  const [err,   setErr]   = useState("");
  const [sbUsed, setSbUsed] = useState(false);

  // Load vehicle options from Supabase on mount, fall back to local
  useEffect(() => {
    (async () => {
      const sbRows = await sbFetchVehicleOptions();
      const finalRows = sbRows || localVehicleRows();
      setSbUsed(!!sbRows);
      setRows(finalRows);
      setLoading(false);
      // Pre-select if vehicle matches
      const vy = String(vehicle.year);
      const yrs = getAvailYears(finalRows);
      if (yrs.includes(vy)) {
        setYear(vy);
        const mks = getAvailMakes(finalRows, vy);
        if (mks.includes(vehicle.make)) {
          setMake(vehicle.make);
          const mods = getAvailModels(finalRows, vy, vehicle.make);
          if (mods.includes(vehicle.model)) {
            setModel(vehicle.model);
            const trs = getAvailTrims(finalRows, vy, vehicle.make, vehicle.model);
            if (trs.length === 1) setTrim(trs[0]);
          }
        }
      }
    })();
  }, []);

  function onYearChange(y)  { setYear(y); setMake(""); setModel(""); setTrim(""); }
  function onMakeChange(mk) {
    setMake(mk); setModel(""); setTrim("");
    const mods = getAvailModels(rows, year, mk);
    if (mods.length === 1) {
      setModel(mods[0]);
      const trs = getAvailTrims(rows, year, mk, mods[0]);
      if (trs.length === 1) setTrim(trs[0]);
    }
  }
  function onModelChange(mod) {
    setModel(mod); setTrim("");
    const trs = getAvailTrims(rows, year, make, mod);
    if (trs.length === 1) setTrim(trs[0]);
  }

  async function submit(e) {
    e.preventDefault(); setErr(""); setSub(true);
    if (!year || !make || !model || !trim) { setErr("Please select all four fields."); setSub(false); return; }
    const raw = (await sbFetchSchedule(year, make, model, trim)) || localSchedule(year, make, model);
    setSub(false);
    if (!raw) { setErr("No schedule found for this vehicle."); return; }
    onSuccess({ trim, apiSchedule: parseApiData(raw) });
  }

  const sel = "w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 bg-white disabled:bg-gray-50 disabled:text-gray-400 disabled:cursor-not-allowed";
  const lbl = "block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1";
  const availYears  = rows ? getAvailYears(rows) : [];
  const availMakes  = rows ? getAvailMakes(rows, year) : [];
  const availModels = rows ? getAvailModels(rows, year, make) : [];
  const availTrims  = rows ? getAvailTrims(rows, year, make, model) : [];

  return (
    <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm max-h-screen overflow-y-auto" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between p-5 border-b border-gray-100 sticky top-0 bg-white z-10">
          <div className="flex items-center gap-2.5">
            <div className="w-8 h-8 bg-purple-600 rounded-lg flex items-center justify-center"><SparkleIcon size={16} className="text-white"/></div>
            <div>
              <h2 className="text-sm font-bold text-gray-800">OEM Maintenance Schedule</h2>
              <p className="text-xs text-gray-500">{loading ? "Connecting to database…" : (sbUsed ? "Live from Supabase" : "Using local database")}</p>
            </div>
          </div>
          <button onClick={onClose} className="p-1.5 hover:bg-gray-100 rounded-lg"><XIcon size={18} className="text-gray-500"/></button>
        </div>
        <form onSubmit={submit} className="p-5 space-y-4">
          <div className={`border rounded-lg p-3 text-xs ${sbUsed ? "bg-green-50 border-green-100 text-green-700" : "bg-purple-50 border-purple-100 text-purple-700"}`}>
            {loading ? "Loading vehicle options…" : (sbUsed ? "Connected to Supabase — live data" : "Supabase unavailable — using local database fallback")}
          </div>

          {/* Year */}
          <div>
            <label className={lbl}>Year <span className="text-red-500">*</span></label>
            <select value={year} onChange={e=>onYearChange(e.target.value)} disabled={loading} className={sel}>
              <option value="">{loading ? "Loading…" : "Select year"}</option>
              {availYears.map(y=><option key={y} value={y}>{y}</option>)}
            </select>
          </div>
          {/* Make */}
          <div>
            <label className={lbl}>Make <span className="text-red-500">*</span></label>
            <select value={make} onChange={e=>onMakeChange(e.target.value)} disabled={!year} className={sel}>
              <option value="">{year ? "Select make" : "Select a year first"}</option>
              {availMakes.map(m=><option key={m} value={m}>{m}</option>)}
            </select>
          </div>
          {/* Model */}
          <div>
            <label className={lbl}>Model <span className="text-red-500">*</span></label>
            <select value={model} onChange={e=>onModelChange(e.target.value)} disabled={!make} className={sel}>
              <option value="">{make ? "Select model" : "Select a make first"}</option>
              {availModels.map(m=><option key={m} value={m}>{m}</option>)}
            </select>
          </div>
          {/* Trim */}
          <div>
            <label className={lbl}>Trim <span className="text-red-500">*</span></label>
            <select value={trim} onChange={e=>setTrim(e.target.value)} disabled={!model} className={sel}>
              <option value="">{model ? "Select trim" : "Select a model first"}</option>
              {availTrims.map(t=><option key={t} value={t}>{t}</option>)}
            </select>
          </div>

          {err && <div className="text-xs text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2">{err}</div>}
          <div className="flex gap-2">
            <button type="button" onClick={onClose}
              className="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-medium text-gray-600 hover:bg-gray-50 transition-colors">
              Cancel
            </button>
            <button type="submit" disabled={!trim || submitting}
              className="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-purple-600 text-white text-sm font-semibold hover:bg-purple-700 transition-colors disabled:opacity-60">
              {submitting ? <><SpinnerIcon size={14}/> Loading…</> : <><SparkleIcon size={14}/> Load Schedule</>}
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

    const mods = getAvailModels(rows, year, mk);
    if (mods.length === 1) {

// ─── 2FA SETUP MODAL ─────────────────────────────────────────────
function TwoFASetupModal({ userEmail, uid, onEnabled, onClose }) {
  const [secret]         = useState(() => newTotpSecret());
  const [step, setStep]  = useState("scan");   // "scan" | "verify"
  const [code, setCode]  = useState("");
  const [err,  setErr]   = useState("");
  const [busy, setBusy]  = useState(false);
  const uri = totpUri(secret, userEmail);

  async function confirm(e) {
    e.preventDefault(); setErr(""); setBusy(true);
    const ok = await verifyTotp(secret, code);
    setBusy(false);
    if (!ok) { setErr("Incorrect code — make sure your phone's time is synced and try again."); return; }
    await save2FA(uid, { enabled: true, secret });
    onEnabled({ enabled: true, secret });
  }

  const inp = "w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white tracking-widest text-center text-xl font-mono";

  return (
    <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between p-5 border-b border-gray-100">
          <div className="flex items-center gap-2.5">
            <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center"><ShieldIcon size={16} className="text-white"/></div>
            <div>
              <h2 className="text-sm font-bold text-gray-800">Set Up Two-Factor Auth</h2>
              <p className="text-xs text-gray-500">Step {step === "scan" ? "1" : "2"} of 2</p>
            </div>
          </div>
          <button onClick={onClose} className="p-1.5 hover:bg-gray-100 rounded-lg"><XIcon size={18} className="text-gray-500"/></button>
        </div>

        {step === "scan" && (
          <div className="p-5 space-y-4">
            <p className="text-sm text-gray-600">Open <strong>Google Authenticator</strong> (or any TOTP app), tap the <strong>+</strong> button, and scan this QR code:</p>
            <div className="flex justify-center bg-white border border-gray-100 rounded-xl p-4">
              <QRCodeView value={uri} size={180}/>
            </div>
            <div>
              <p className="text-xs text-gray-500 mb-1 font-medium">Can't scan? Enter this key manually:</p>
              <div className="bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-center font-mono text-sm text-gray-800 tracking-widest select-all break-all">
                {fmtSecret(secret)}
              </div>
              <p className="text-xs text-gray-400 mt-1 text-center">Account: AutoTrax · Type: Time-based</p>
            </div>
            <button onClick={() => setStep("verify")}
              className="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm transition-colors">
              I've added it → Next
            </button>
          </div>
        )}

        {step === "verify" && (
          <form onSubmit={confirm} className="p-5 space-y-4">
            <p className="text-sm text-gray-600">Enter the <strong>6-digit code</strong> from Google Authenticator to confirm setup:</p>
            <div>
              <input autoFocus type="text" inputMode="numeric" maxLength={6} placeholder="000000"
                value={code} onChange={e=>setCode(e.target.value.replace(/\D/g,""))} className={inp}/>
              {err && <p className="text-xs text-red-600 mt-2">{err}</p>}
            </div>
            <div className="flex gap-2">
              <button type="button" onClick={() => { setStep("scan"); setCode(""); setErr(""); }}
                className="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-medium text-gray-600 hover:bg-gray-50 transition-colors">
                ← Back
              </button>
              <button type="submit" disabled={busy || code.length < 6}
                className="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 transition-colors disabled:opacity-60">
                {busy ? <><SpinnerIcon size={14}/> Verifying…</> : <><ShieldIcon size={14}/> Enable 2FA</>}
              </button>
            </div>
          </form>
        )}
      </div>
    </div>
  );
}

            <input autoFocus type="text" inputMode="numeric" maxLength={6} placeholder="000000"

            {err && <p className="text-xs text-red-600 mt-2">{err}</p>}

          <div className="flex gap-2">

// ─── 2FA VERIFY MODAL (shown at login) ───────────────────────────
function TwoFAVerifyScreen({ secret, onVerified, onCancel }) {
  const [code, setCode] = useState("");
  const [err,  setErr]  = useState("");
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault(); setErr(""); setBusy(true);

  return (
    <div style={{height:"100vh"}} className="flex items-center justify-center bg-gradient-to-br from-gray-900 via-gray-800 to-blue-950 p-4">

        <div className="bg-white rounded-2xl shadow-2xl p-6">
          <form onSubmit={submit} className="space-y-4">
            <div>
              <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">6-Digit Code</label>
              <input autoFocus type="text" inputMode="numeric" maxLength={6} placeholder="000 000"
                value={code} onChange={e=>setCode(e.target.value.replace(/\D/g,""))}
                className="w-full border border-gray-200 rounded-xl px-4 py-3 text-center text-2xl font-mono tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white"/>
            </div>
            {err && <div className="text-sm text-red-600 bg-red-50 border border-red-200 rounded-xl px-4 py-3">{err}</div>}
            <button type="submit" disabled={busy || code.length < 6}
              className="w-full flex items-center justify-center gap-2 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm transition-colors disabled:opacity-60 shadow-lg shadow-blue-200">

            </button>
          </form>
          <button onClick={onCancel} className="mt-4 w-full text-center text-gray-400 hover:text-gray-600 text-xs transition-colors">

}

// ─── APP CONTENT (main app, shown after auth) ────────────────────
function AppContent({ user, onLogout }) {
  // When running offline (no Firebase or no user), read localStorage synchronously
  // inside the useState initializer so there is never a blank loading flash.
  const isOffline = !window.FB_READY || !user;

  function readLocalVehicles() {
    try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); } catch { return []; }
  }

  const [vehicles,  setVehicles]   = useState(() => isOffline ? readLocalVehicles() : []);
  const [dataLoaded,setDataLoaded] = useState(isOffline); // offline = already loaded
  const [activeId,  setActiveId]   = useState(() => {
    if (!isOffline) return null;
    const vs = readLocalVehicles();
    return vs.length > 0 ? vs[0].id : null;
  });
  const [showAdd,   setShowAdd]    = useState(false);
  const [logModal,  setLogModal]   = useState(null);
  const [fetchModal,setFetchModal] = useState(false);
  const [tab,       setTab]        = useState("schedule");
  const [catFilter, setCat]        = useState("All");
  const [stFilter,  setSt]         = useState("All");
  const [showUser,      setShowUser]      = useState(false);
  const [saving,        setSaving]        = useState(false);
  const [menuOpen,      setMenuOpen]      = useState(false);
  const [twoFAData,     setTwoFAData]     = useState(null);   // null = loading
  // Persist 2FA verification across refreshes within the same browser session
  const _2FA_SESSION_KEY = "autolog_2fa_session";
  const [twoFAVerified, _setTwoFAVerified] = useState(() => sessionStorage.getItem(_2FA_SESSION_KEY) === "true");
  function setTwoFAVerified(val) {
    if (val) sessionStorage.setItem(_2FA_SESSION_KEY, "true");
    else sessionStorage.removeItem(_2FA_SESSION_KEY);
    _setTwoFAVerified(val);
  }
  const [showTwoFASetup,setShowTwoFASetup]= useState(false);
  const [showTwoFAOff,  setShowTwoFAOff] = useState(false);

  // Load from Firestore only when in cloud mode
  useEffect(() => {
    if (isOffline) {
      // Offline: load 2FA data synchronously from localStorage
      load2FA(null).then(d => setTwoFAData(d));
      return;
    }

    // Safety timeout — if Firestore hangs for any reason (e.g. not set up yet),
    // show the app after 6 seconds rather than staying stuck on loading screen.
    const giveUp = setTimeout(() => { setDataLoaded(true); setTwoFAData({ enabled: false }); }, 6000);

    Promise.all([loadVehicles(user.uid), load2FA(user.uid)])
      .then(([vs, fa]) => {
        clearTimeout(giveUp);
        setVehicles(vs);
        setActiveId(vs.length > 0 ? vs[0].id : null);
        setTwoFAData(fa);
        setDataLoaded(true);
      })
      .catch(() => {
        clearTimeout(giveUp);
        setTwoFAData({ enabled: false });
        setDataLoaded(true);
      });

    return () => clearTimeout(giveUp);
  }, []);

  // Debounced save whenever vehicles change
  const saveTimer = useRef(null);
  useEffect(() => {
    if (!dataLoaded) return;
    clearTimeout(saveTimer.current);
    setSaving(true);
    saveTimer.current = setTimeout(async () => {
      await saveVehicles(user ? user.uid : null, vehicles);
      setSaving(false);
    }, 800);
    return () => clearTimeout(saveTimer.current);
  }, [vehicles, dataLoaded]);

  // ALL hooks must come before any early return — Rules of Hooks
  const vehicle    = vehicles.find(v => v.id === activeId) || null;
  const schedule   = vehicle
    ? (vehicle.apiSchedule?.length > 0 ? vehicle.apiSchedule : getBuiltinSchedule(vehicle.make))
    : [];
  const isApiSched = !!(vehicle?.apiSchedule?.length);

  const statuses = useMemo(() => {
    if (!vehicle) return {};
    return Object.fromEntries(schedule.map(item => [item.id, getStatus(item, vehicle.currentMileage, vehicle.serviceLogs)]));
  }, [vehicle, schedule]);

  const stats = useMemo(() => {
    if (!vehicle) return null;
    const all = schedule.map(item => statuses[item.id]);
    return {
      overdue: all.filter(s => s.status === "overdue").length,
      soon:    all.filter(s => s.status === "soon").length,
      good:    all.filter(s => s.status === "good").length,
    };
  }, [vehicle, schedule, statuses]);

  // Now safe to early-return — all hooks have been called above
  if (!dataLoaded || twoFAData === null) return <LoadingScreen message="Loading your vehicles…"/>;

  // 2FA gate — if enabled and not yet verified this session, show verify screen
  if (twoFAData.enabled && !twoFAVerified) {
    return (
      <TwoFAVerifyScreen
        secret={twoFAData.secret}
        onVerified={() => setTwoFAVerified(true)}
        onCancel={() => {
          setTwoFAVerified(false);
          if (window.FB_READY && window.fbAuth) window.fbAuth.signOut();
          onLogout();
        }}
      />
    );
  }

  function addVehicle(v)     { setVehicles(p => [...p, v]); setActiveId(v.id); setTab("schedule"); }
  function removeVehicle(id) { const u = vehicles.filter(v => v.id !== id); setVehicles(u); if (activeId === id) setActiveId(u[0]?.id || null); }
  function updateMileage(id, m) { setVehicles(p => p.map(v => v.id === id ? {...v, currentMileage: m} : v)); }
  function logService(entry) { setVehicles(p => p.map(v => v.id === activeId ? {...v, serviceLogs: [...v.serviceLogs, entry]} : v)); }
  function deleteLog(logId)  { setVehicles(p => p.map(v => v.id === activeId ? {...v, serviceLogs: v.serviceLogs.filter(l => l.id !== logId)} : v)); }
  function applyApiSchedule({vin, trim, apiSchedule}) {
    setVehicles(p => p.map(v => v.id === activeId ? {...v, vin, trim, apiSchedule, apiError: ""} : v));
    setFetchModal(false);
  }

  const filtered = schedule.filter(item => {
    const catOk = catFilter === "All" || item.category === catFilter;
    const s = statuses[item.id]?.status || "unknown";
    const stOk = stFilter === "All" || s === stFilter.toLowerCase();
    return catOk && stOk;
  });

  function sidebarStats(v) {
    const sch = v.apiSchedule?.length ? v.apiSchedule : getBuiltinSchedule(v.make);
    const sts = sch.map(item => getStatus(item, v.currentMileage, v.serviceLogs));
    return {od: sts.filter(s => s.status === "overdue").length, sn: sts.filter(s => s.status === "soon").length};
  }

  const isCloud    = window.FB_READY && user;
  const userEmail  = user?.email || "";
  const userInitial = userEmail ? userEmail[0].toUpperCase() : "?";

  return (
    <div style={{height:"100vh"}} className="flex bg-gray-50 overflow-hidden relative">

      {/* Mobile sidebar backdrop */}
      {menuOpen && <div className="fixed inset-0 bg-black bg-opacity-60 z-30 md:hidden" onClick={()=>setMenuOpen(false)}/>}

      {/* SIDEBAR */}
      <aside className={`fixed inset-y-0 left-0 z-40 w-72 md:w-64 bg-gray-900 flex flex-col flex-shrink-0 transition-transform duration-300 md:relative md:translate-x-0 md:z-auto ${menuOpen ? "translate-x-0" : "-translate-x-full"}`} style={{height:"100vh"}}>
        {/* App header */}
        <div className="p-4 border-b border-gray-700 flex-shrink-0">
          <div className="flex items-center justify-between gap-2.5">
            <div className="flex items-center gap-2.5">
              <div className="w-9 h-9 bg-blue-500 rounded-xl flex items-center justify-center"><CarIcon size={20} className="text-white"/></div>
              <div>
                <div className="text-white font-bold text-sm">AutoTrax</div>
                <div className="text-gray-400 text-xs flex items-center gap-1">
                  {isCloud
                    ? <><CloudIcon size={10} className="text-blue-400"/> Cloud sync</>
                    : "Local storage"
                  }
                  {saving && <SpinnerIcon size={10} className="text-gray-500 ml-1"/>}
                </div>
              </div>
            </div>
            <button onClick={()=>setMenuOpen(false)} className="md:hidden p-1.5 hover:bg-gray-700 rounded-lg"><XIcon size={18} className="text-gray-400"/></button>
          </div>
        </div>

        {/* Vehicle list */}
        <div className="flex-1 overflow-y-auto p-3 space-y-1">
          {vehicles.length === 0 && <p className="text-gray-500 text-xs text-center mt-8 px-2 leading-relaxed">No vehicles yet. Add your first car to get started.</p>}
          {vehicles.map(v => {
            const {od, sn} = sidebarStats(v);
            const isActive = v.id === activeId;
            return (
              <div key={v.id} onClick={() => { setActiveId(v.id); setMenuOpen(false); }}
                className={`group relative rounded-xl p-3 cursor-pointer transition-all ${isActive ? "bg-blue-600" : "hover:bg-gray-800"}`}>
                <div className="flex items-start justify-between">
                  <div className="flex-1 min-w-0">
                    <div className={`text-sm font-semibold truncate ${isActive ? "text-white" : "text-gray-200"}`}>{v.nickname || `${v.year} ${v.make}`}</div>
                    <div className={`text-xs truncate ${isActive ? "text-blue-100" : "text-gray-400"}`}>{v.model} · {v.currentMileage.toLocaleString()} mi</div>
                    {v.apiSchedule?.length > 0 && <div className={`text-xs mt-0.5 ${isActive ? "text-purple-200" : "text-purple-400"}`}>✦ OEM Data</div>}
                  </div>
                  <button onClick={e => {e.stopPropagation(); removeVehicle(v.id);}}
                    className={`opacity-0 group-hover:opacity-100 p-1 rounded ${isActive ? "hover:bg-blue-500" : "hover:bg-gray-700"}`}>
                    <TrashIcon size={12} className={isActive ? "text-blue-100" : "text-gray-400"}/>
                  </button>
                </div>
                {(od > 0 || sn > 0) && <div className="flex gap-1 mt-2 flex-wrap">
                  {od > 0 && <span className="text-xs bg-red-500 text-white px-1.5 py-0.5 rounded-full font-semibold">{od} overdue</span>}
                  {sn > 0 && <span className="text-xs bg-amber-500 text-white px-1.5 py-0.5 rounded-full font-semibold">{sn} due soon</span>}
                </div>}
              </div>
            );
          })}
        </div>

        {/* Add vehicle button */}
        <div className="p-3 border-t border-gray-700 flex-shrink-0">
          <button onClick={() => { setShowAdd(true); setMenuOpen(false); }} className="w-full flex items-center justify-center gap-2 px-3 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl transition-colors">

              </button>

              {showUser && (

                      : <button onClick={() => { setShowUser(false); setShowTwoFASetup(true); }}

                      {label:"Due Soon",  count:stats.soon,    cls:"text-amber-700 bg-amber-50 border-amber-200"},
                      {label:"Good",      count:stats.good,    cls:"text-emerald-700 bg-emerald-50 border-emerald-200"},
                    ].map(({label,count,cls}) => (
                      <div key={label} className={`text-center px-2 sm:px-3 py-1.5 sm:py-2 rounded-xl border ${cls}`}>
                        <div className="text-xl sm:text-2xl font-bold leading-tight">{count}</div>
                        <div className="text-xs font-medium whitespace-nowrap hidden sm:block">{label}</div>
                        <div className="text-xs font-medium whitespace-nowrap sm:hidden">{label.split(" ")[0]}</div>
                      </div>
                    ))}
                  </div>}
                  <button onClick={() => setFetchModal(true)}
                    className="flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 text-xs font-semibold rounded-lg bg-purple-600 hover:bg-purple-700 text-white transition-colors">
                    <RefreshIcon size={12}/><span className="hidden sm:inline">{isApiSched ? "Refresh OEM Schedule" : "Fetch OEM Schedule"}</span><span className="sm:hidden">OEM</span>
                  </button>
                </div>
              </div>

              {/* TABS */}
              <div className="flex gap-1 mt-3 sm:mt-4">
                {[{id:"schedule",label:"Maintenance Schedule",shortLabel:"Schedule",Icon:WrenchIcon},{id:"history",label:"Service History",shortLabel:"History",Icon:HistoryIcon}].map(t=>(
                  <button key={t.id} onClick={() => setTab(t.id)}
                    className={`flex items-center gap-1.5 px-3 sm:px-4 py-2 rounded-lg text-sm font-medium transition-colors ${tab === t.id ? "bg-blue-600 text-white" : "text-gray-500 hover:bg-gray-100"}`}>
                    <t.Icon size={14}/><span className="hidden sm:inline"> {t.label}</span><span className="sm:hidden">{t.shortLabel}</span>
                  </button>
                ))}
              </div>
            </header>

            {/* SCHEDULE TAB */}
            {tab === "schedule" && (
              <div className="flex-1 overflow-y-auto p-3 sm:p-6">
                <div className="mb-4 space-y-2">
                  <div className="flex items-center gap-1 overflow-x-auto pb-1 scrollbar-none" style={{scrollbarWidth:"none",msOverflowStyle:"none"}}>
                    <span className="text-xs text-gray-500 font-medium flex-shrink-0">Category:</span>
                    {CATEGORIES.filter(c => c === "All" || schedule.some(s => s.category === c)).map(cat => (
                      <button key={cat} onClick={() => setCat(cat)}
                        className={`px-2.5 py-1 rounded-lg text-xs font-medium transition-colors flex-shrink-0 ${catFilter === cat ? "bg-gray-800 text-white" : "bg-white border border-gray-200 text-gray-600 hover:bg-gray-50"}`}>
                        {cat}
                      </button>
                    ))}
                  </div>
                  <div className="flex items-center gap-1 overflow-x-auto pb-1" style={{scrollbarWidth:"none",msOverflowStyle:"none"}}>
                    <span className="text-xs text-gray-500 font-medium flex-shrink-0">Status:</span>
                    {["All","Overdue","Soon","Good","Unknown"].map(st => (
                      <button key={st} onClick={() => setSt(st)}
                        className={`px-2.5 py-1 rounded-lg text-xs font-medium transition-colors flex-shrink-0 ${stFilter === st ? "bg-gray-800 text-white" : "bg-white border border-gray-200 text-gray-600 hover:bg-gray-50"}`}>
                        {st}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="space-y-2">
                  {filtered.length === 0 && <div className="text-center py-12 text-gray-400 text-sm">No items match your filters.</div>}
                  {filtered.map(item => {
                    const s = statuses[item.id];
                    const sc = STATUS_CFG[s.status];
                    const pc = PRIORITY_CFG[item.priority];
                    return (
                      <div key={item.id} className={`bg-white rounded-xl border ${sc.border} p-3 sm:p-4 hover:shadow-sm transition-shadow`}>
                        {/* Mobile layout */}
                        <div className="flex items-start gap-3 sm:hidden">
                          <div className={`w-2 h-2 rounded-full flex-shrink-0 mt-1.5 ${pc.dot}`}/>
                          <div className="flex-1 min-w-0">
                            <div className="flex items-start justify-between gap-2">
                              <div className="flex-1 min-w-0">
                                <div className="flex items-center gap-1.5 flex-wrap mb-0.5">
                                  <span className="text-sm font-semibold text-gray-800">{item.name}</span>
                                </div>
                                <div className="flex items-center gap-1.5 flex-wrap mb-1">
                                  <span className={`text-xs px-1.5 py-0.5 rounded font-medium ${pc.bg} ${pc.text}`}>{item.category}</span>
                                  {item.source === "api" && <span className="text-xs px-1.5 py-0.5 rounded font-medium bg-purple-50 text-purple-600 border border-purple-100">OEM</span>}
                                </div>
                                {item.note && <p className="text-xs text-gray-400 truncate">{item.note}</p>}
                              </div>
                              <StatusBadge status={s.status}/>
                            </div>
                            <div className="mt-2"><ProgressBar pct={s.pct} status={s.status}/></div>
                            <div className="flex items-center justify-between mt-2 text-xs">
                              <div>
                                <span className="text-gray-400">Remaining: </span>
                                <span className={`font-bold ${s.status === "overdue" ? "text-red-600" : s.status === "soon" ? "text-amber-600" : "text-gray-700"}`}>
                                  {s.status === "overdue" ? `${fmtMi(Math.abs(s.remaining))} over` : s.remaining != null ? fmtMi(s.remaining) : "—"}
                                </span>
                              </div>
                              <button onClick={() => setLogModal({service: item})}
                                className="flex items-center gap-1 px-3 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold rounded-lg transition-colors">
                                <WrenchIcon size={12}/> Log
                              </button>
                            </div>
                          </div>
                        </div>
                        {/* Desktop layout */}
                        <div className="hidden sm:flex items-center gap-4">
                          <div className={`w-2 h-2 rounded-full flex-shrink-0 ${pc.dot}`}/>
                          <div className="flex-1 min-w-0">
                            <div className="flex items-center gap-2 mb-0.5 flex-wrap">
                              <span className="text-sm font-semibold text-gray-800">{item.name}</span>
                              <span className={`text-xs px-1.5 py-0.5 rounded font-medium ${pc.bg} ${pc.text}`}>{item.category}</span>
                              {item.source === "api" && <span className="text-xs px-1.5 py-0.5 rounded font-medium bg-purple-50 text-purple-600 border border-purple-100">OEM</span>}
                            </div>
                            {item.note && <p className="text-xs text-gray-400 truncate">{item.note}</p>}
                            <div className="mt-2"><ProgressBar pct={s.pct} status={s.status}/></div>
                          </div>
                          <div className="flex items-center gap-4 flex-shrink-0 text-xs">
                            <div className="text-center">
                              <div className="text-gray-400 uppercase tracking-wide mb-0.5">Interval</div>
                              <div className="font-semibold text-gray-700">{fmtMi(item.interval)}</div>
                            </div>
                            <div className="text-center">
                              <div className="text-gray-400 uppercase tracking-wide mb-0.5">Last Done</div>
                              <div className="font-semibold text-gray-700">{s.lastMi != null ? fmtMi(s.lastMi) : "Never"}</div>
                              {s.lastLog && <div className="text-gray-400">{fmtDate(s.lastLog.date)}</div>}
                            </div>
                            <div className="text-center">
                              <div className="text-gray-400 uppercase tracking-wide mb-0.5">Due At</div>
                              <div className="font-semibold text-gray-700">{fmtMi(s.dueAt)}</div>
                            </div>
                            <div className="text-center min-w-24">
                              <div className="text-gray-400 uppercase tracking-wide mb-0.5">Remaining</div>
                              <div className={`font-bold ${s.status === "overdue" ? "text-red-600" : s.status === "soon" ? "text-amber-600" : "text-gray-700"}`}>
                                {s.status === "overdue" ? `${fmtMi(Math.abs(s.remaining))} overdue` : s.remaining != null ? fmtMi(s.remaining) : "—"}
                              </div>
                            </div>
                            <StatusBadge status={s.status}/>
                            <button onClick={() => setLogModal({service: item})}
                              className="flex items-center gap-1.5 px-3 py-2 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold rounded-lg transition-colors whitespace-nowrap">
                              <WrenchIcon size={12}/> Log
                            </button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* HISTORY TAB */}
            {tab === "history" && (
              <div className="flex-1 overflow-y-auto p-3 sm:p-6">
                {vehicle.serviceLogs.length === 0 ? (
                  <div className="text-center py-16 text-gray-400">
                    <HistoryIcon size={40} className="mx-auto mb-3 opacity-30"/>
                    <p className="text-sm">No service logs yet.</p>
                    <p className="text-xs mt-1">Use the Log button on the Maintenance Schedule tab.</p>
                  </div>
                ) : (
                  <div className="space-y-2">
                    {[...vehicle.serviceLogs].sort((a,b) => b.mileage - a.mileage).map(log => (
                      <div key={log.id} className="bg-white rounded-xl border border-gray-100 p-3 sm:p-4 hover:shadow-sm transition-shadow">
                        <div className="flex items-center gap-3">
                          <div className="w-8 h-8 bg-emerald-50 rounded-lg flex items-center justify-center flex-shrink-0"><CheckIcon size={16} className="text-emerald-500"/></div>
                          <div className="flex-1 min-w-0">
                            <div className="text-sm font-semibold text-gray-800">{log.serviceName}</div>
                            {log.notes && <div className="text-xs text-gray-500 mt-0.5 truncate">{log.notes}</div>}
                            {/* Mobile: date + mileage inline */}
                            <div className="sm:hidden flex items-center gap-3 mt-1 text-xs text-gray-500">
                              <span>{fmtDate(log.date)}</span>
                              <span>·</span>
                              <span>{log.mileage.toLocaleString()} mi</span>
                            </div>
                          </div>
                          {/* Desktop: separate columns */}
                          <div className="hidden sm:flex items-center gap-6 text-xs flex-shrink-0">
                            <div className="text-center"><div className="text-gray-400 uppercase tracking-wide mb-0.5">Date</div><div className="font-semibold text-gray-700">{fmtDate(log.date)}</div></div>
                            <div className="text-center"><div className="text-gray-400 uppercase tracking-wide mb-0.5">Mileage</div><div className="font-semibold text-gray-700">{log.mileage.toLocaleString()} mi</div></div>
                          </div>
                          <button onClick={() => deleteLog(log.id)} className="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors flex-shrink-0"><TrashIcon size={14}/></button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </>
        )}
      </main>

      {/* MODALS */}
      {showAdd    && <AddVehicleModal onAdd={addVehicle} onClose={() => setShowAdd(false)}/>}
      {logModal   && <LogServiceModal service={logModal.service} currentMileage={vehicle.currentMileage} onLog={logService} onClose={() => setLogModal(null)}/>}
      {fetchModal && vehicle && <FetchScheduleModal vehicle={vehicle} onSuccess={applyApiSchedule} onClose={() => setFetchModal(false)}/>}
      {showTwoFASetup && (
        <TwoFASetupModal
          userEmail={userEmail || "user"}
          uid={user?.uid || null}
          onEnabled={d => { setTwoFAData(d); setTwoFAVerified(true); setShowTwoFASetup(false); }}
          onClose={() => setShowTwoFASetup(false)}
        />
      )}
      {showTwoFAOff && twoFAData?.enabled && (
        <TwoFADisableModal
          uid={user?.uid || null}
          secret={twoFAData.secret}
          onDisabled={() => { setTwoFAData({ enabled: false }); setShowTwoFAOff(false); }}
          onClose={() => setShowTwoFAOff(false)}
        />
      )}
    </div>
  );
}

// ─── ROOT APP (handles auth gate) ────────────────────────────────
function App() {
  // undefined = checking auth, null = not logged in, User object = logged in
  const [user, setUser] = useState(window.FB_READY ? undefined : null);

  // When Firebase is not configured: show the setup screen every time until
  // the user actually configures Firebase. "Continue offline" only skips it
  // for the current session — next reload it will appear again.
  const [setupDone, setSetupDone] = useState(window.FB_READY);

  useEffect(() => {
    if (!window.FB_READY) return;
    const unsub = window.fbAuth.onAuthStateChanged(u => setUser(u || null));
    return unsub;
  }, []);

  // Still checking Firebase auth state
  if (user === undefined) return <LoadingScreen message="Checking account…"/>;

  // Firebase config not set up — show setup screen every session
  if (!window.FB_READY && !setupDone) return (
    <SetupScreen onContinueOffline={() => setSetupDone(true)}/>
  );

  // Firebase configured but not logged in — show auth screen
  if (window.FB_READY && !user) return (
    <AuthScreen onAuth={u => setUser(u)}/>
  );

  // Logged in (cloud) or offline (localStorage) — show app
  return (
    <AppContent
      user={user}
      onLogout={() => {
        sessionStorage.removeItem("autolog_2fa_session");
        if (window.FB_READY && window.fbAuth) window.fbAuth.signOut();
        setUser(null);
      }}
    />
  );
}

// ─── ERROR BOUNDARY ──────────────────────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(err) { return { error: err }; }
  render() {
    if (!this.state.error) return this.props.children;
    const msg = this.state.error?.message || String(this.state.error);
    return (
      <div style={{height:"100vh"}} className="flex items-center justify-center bg-gray-900 p-6">
        <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 text-center">
          <div className="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <AlertIcon size={24} className="text-red-500"/>
          </div>
          <h2 className="text-lg font-bold text-gray-800 mb-2">Something went wrong</h2>
          <p className="text-sm text-gray-500 mb-4">
            There was an error loading AutoTrax. This can happen if Firestore isn't set up yet, or if your account session expired.
          </p>
          <div className="bg-gray-100 rounded-lg px-4 py-3 text-xs text-gray-600 font-mono text-left mb-5 break-all">
            {msg}
          </div>
          <div className="flex gap-2">
            <button onClick={() => { if(window.FB_READY && window.fbAuth) window.fbAuth.signOut(); window.location.reload(); }}
              className="flex-1 px-4 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700">
              Sign Out &amp; Retry
            </button>
            <button onClick={() => window.location.reload()}
              className="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-medium text-gray-600 hover:bg-gray-50">
              Reload
            </button>
          </div>
        </div>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundary><App/></ErrorBoundary>
);
</script>
